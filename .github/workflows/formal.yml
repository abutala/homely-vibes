name: Formal

# Runs the Quint model checks: the randomized search (make formal), then the
# exhaustive check of the rows that must hold (make formal-verify).
# Path-filtered to the model and its tooling only. A model cannot see the code
# it describes, so running it on a code change would report green for a change
# it never read; the tests named in formal/README.md are what tie the two.
# Not a required check; a skipped run reports nothing.

on:
  push:
    branches: [ "main" ]
    paths:
      - "formal/**"
      - "Makefile"
      - ".github/workflows/formal.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "formal/**"
      - "Makefile"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formal/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Quint
        run: make formal-deps

      - name: Check models (randomized search)
        run: make formal

      - name: Check models (exhaustive)
        run: make formal-verify
