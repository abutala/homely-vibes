name: Formal

# Runs the Quint model checks (make formal) and the exhaustive proofs
# (make formal-verify). Path-filtered: the model describes the Ring token lock,
# so it only needs to run when the model or the code it describes changes. Not a
# required check; a skipped run reports nothing.

on:
  push:
    branches: [ "main" ]
    paths:
      - "formal/**"
      - "lib/file_lock.py"
      - "RingBeams/**"
      - "RingSecurity/**"
      - "Makefile"
      - ".github/workflows/formal.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "formal/**"
      - "lib/file_lock.py"
      - "RingBeams/**"
      - "RingSecurity/**"
      - "Makefile"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formal/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Quint downloads
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/package-lock.json') }}

      - name: Install Quint
        run: make formal-deps

      - name: Check models
        run: make formal

      - name: Prove models
        run: make formal-verify
