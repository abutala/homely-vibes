name: Formal

# Runs the exhaustive proofs (make formal-verify) and the model checks (make
# formal), on demand only: Actions > Formal > Run workflow, or
# `gh workflow run formal.yml --ref <branch>`. Proofs first: they download the
# Apalache jar, whose TLC the `// backend: tlc` models need in both steps. Not a
# required check.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formal/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Quint downloads
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/package-lock.json') }}

      - name: Install Quint
        run: make formal-deps

      - name: Prove models
        run: make formal-verify

      - name: Check models
        run: make formal
