name: Formal

# Runs the Quint model checks (make formal) and the exhaustive proofs
# (make formal-verify), on demand only (Amit, 2026-11-07: a proof run took
# over 45 minutes and blocked a merge). Start it from the Actions tab or with
# `gh workflow run formal.yml --repo abutala/homely-vibes --ref <branch>`.
# Not a required check.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formal/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Quint downloads
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/package-lock.json') }}

      - name: Install Quint
        run: make formal-deps

      - name: Check models
        run: make formal

      - name: Prove models
        run: make formal-verify
