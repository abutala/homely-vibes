# `pre-commit install` (make hooks) installs one hook file per type listed here.
# A hook whose stage is missing from this list is declared but never runs.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: format
        name: Format
        entry: make ruff
        language: system
        require_serial: true
        stages: [pre-commit]
      - id: test
        name: Run Tests
        entry: make test
        language: system
        require_serial: true
        pass_filenames: false
        stages: [pre-commit]
      - id: secrets-scan
        name: Secrets Scan
        entry: .github/scripts/secret-scan.sh
        language: script
        require_serial: true
        stages: [pre-commit]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit Check
        stages: [commit-msg]
        args: []
